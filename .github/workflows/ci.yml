name: CI

# GitHub Flow：功能分支发 PR 到 main，合并前必须过这里。
#
# 这里**只跑测试，不产出 APK**。APK 构建只发生在推 tag 时（见 release.yml）。
# 注意：testDebugUnitTest 会编译整个 debug variant，所以编译错误在这一步就会
# 失败，不用靠 assembleDebug 兜底。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console-web:
    name: 配置台网页与配置解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 网页版的解析/编辑/校验，外加与 bin/wall.sh --check 的交叉验证
      - name: 解析与校验测试
        run: node test/console.mjs

      - name: 仓库读写适配层测试
        run: node test/api.mjs

  android:
    name: Android 单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # allWarningsAsErrors 已打开，有警告这一步就会失败
      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace
